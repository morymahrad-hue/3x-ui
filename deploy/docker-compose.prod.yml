version: '3.8'

services:
  3x-ui:
    image: ghcr.io/morymahrad-hue/3x-ui:latest
    container_name: 3x-ui-server
    restart: always
    network_mode: host
    environment:
      - XRAY_VMESS_AEAD_FORCED=false
      - TZ=UTC
    volumes:
      - ./db:/etc/x-ui/
      - ./cert:/root/cert/
      - /etc/ssl/certs:/etc/ssl/certs:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
